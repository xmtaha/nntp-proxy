services:
  nntp-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nntp-proxy
    ports:
      - "8119:8119"
      # Web admin UI (optional). Bound to loopback on the host by default:
      # the token travels in plain HTTP, so prefer a TLS reverse proxy over
      # changing this to 0.0.0.0. Comment the mapping and NNTP_PROXY_WEB_LISTEN
      # out together to disable the UI.
      - "127.0.0.1:8080:8080"
    environment:
      # Proxy configuration (these match the CLI/env args in src/args.rs)
      NNTP_PROXY_PORT: 8119
      # NNTP_PROXY_THREADS: 4  # Optional: worker threads (default: 1, use 0 for CPU cores)
      RUST_LOG: info  # Log level: trace, debug, info, warn, error
      
      # Web admin UI (optional). Remove both lines to leave the proxy headless.
      # Clients send "Authorization: Bearer <token>".
      NNTP_PROXY_WEB_LISTEN: 0.0.0.0:8080
      # CHANGE THIS before deploying. If left unset, the proxy generates a
      # random token at startup and logs it once (search the logs for
      # "web admin token generated").
      NNTP_PROXY_WEB_TOKEN: change-me-to-a-long-random-token
      
      # Backend servers come from ./nntp-config/config.toml (mounted below).
      # Any NNTP_SERVER_* variable here overrides the file, so leave them out
      # while the volume is mounted. Uncomment these to run without a config.
      # NNTP_SERVER_0_HOST: news.example.com
      # NNTP_SERVER_0_PORT: 119
      # NNTP_SERVER_0_NAME: "Primary News Server"
      # NNTP_SERVER_0_STAT_MISSING: 1  # Probe 430s with STAT on backends that support it
      # NNTP_SERVER_0_USERNAME: your_username  # Optional: backend authentication
      # NNTP_SERVER_0_PASSWORD: your_password  # Optional: backend authentication
      # NNTP_SERVER_0_MAX_CONNECTIONS: 10      # Optional: max connections (default: 10)
      
      # Backend server 1 (optional - for load balancing)
      # NNTP_SERVER_1_HOST: news2.example.com
      # NNTP_SERVER_1_PORT: 119
      # NNTP_SERVER_1_NAME: "Secondary News Server"
      # NNTP_SERVER_1_MAX_CONNECTIONS: 10
      
      # Backend server 2 (optional)
      # NNTP_SERVER_2_HOST: news3.example.com
      # NNTP_SERVER_2_PORT: 119
      # NNTP_SERVER_2_NAME: "Tertiary News Server"
      # NNTP_SERVER_2_MAX_CONNECTIONS: 10
    
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost $$NNTP_PROXY_PORT || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    
    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '1'
          memory: 256M
    
    # Config directory, mounted so the web UI can save it. Mount the directory,
    # not the single file, and keep it writable: the web UI saves config.toml
    # with an atomic rename and writes config.toml.bak beside it, so a :ro mount
    # (or a single-file bind mount) breaks PUT /api/config.
    # When config.toml exists it wins. Comment this out to run from env vars only.
    volumes:
      - ./nntp-config:/etc/nntp-proxy:rw
    
    # Optional: Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Example: Multiple backend servers with load balancing
  nntp-proxy-loadbalanced:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nntp-proxy-lb
    ports:
      - "8120:8119"
      # Optional web admin UI for this instance, loopback-only like the main service.
      - "127.0.0.1:8081:8080"
    environment:
      NNTP_PROXY_PORT: 8119
      RUST_LOG: info
      # Optional web admin UI. Disable by removing these lines and the port mapping.
      NNTP_PROXY_WEB_LISTEN: 0.0.0.0:8080
      NNTP_PROXY_WEB_TOKEN: ${NNTP_PROXY_WEB_TOKEN:-change-me-to-a-long-random-token}
      
      # -----------------------------------------------------------------------------
      # SECURITY WARNING: Never commit real credentials to version control!
      # Use a .env file (which should be in .gitignore) or environment variables.
      # Example: Copy .env.example to .env and fill in your actual credentials.
      # Then use: ${BACKEND_USER_0} and ${BACKEND_PASS_0} below.
      # -----------------------------------------------------------------------------
      
      # Three backend servers for load balancing
      NNTP_SERVER_0_HOST: news1.example.com
      NNTP_SERVER_0_PORT: 119
      NNTP_SERVER_0_NAME: "News Server 1"
      NNTP_SERVER_0_STAT_MISSING: 1
      NNTP_SERVER_0_USERNAME: ${BACKEND_USER_0:-}
      NNTP_SERVER_0_PASSWORD: ${BACKEND_PASS_0:-}
      
      NNTP_SERVER_1_HOST: news2.example.com
      NNTP_SERVER_1_PORT: 119
      NNTP_SERVER_1_NAME: "News Server 2"
      NNTP_SERVER_1_STAT_MISSING: 1
      NNTP_SERVER_1_USERNAME: ${BACKEND_USER_1:-}
      NNTP_SERVER_1_PASSWORD: ${BACKEND_PASS_1:-}
      
      NNTP_SERVER_2_HOST: news3.example.com
      NNTP_SERVER_2_PORT: 119
      NNTP_SERVER_2_NAME: "News Server 3"
      NNTP_SERVER_2_STAT_MISSING: 1
      NNTP_SERVER_2_USERNAME: ${BACKEND_USER_2:-}
      NNTP_SERVER_2_PASSWORD: ${BACKEND_PASS_2:-}
    
    # Health check
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost $$NNTP_PROXY_PORT || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    
    restart: unless-stopped
    profiles:
      - loadbalanced
